# /etc/nginx/sites-available/cyberpvp  (symlink into sites-enabled)
# HTTP only to start — run dashboard/deploy/init_tls.sh after DNS is live and
# certbot will add the 443 listener + redirect automatically.
server {
    listen 80;
    server_name cyberpvp.adverserial.ai;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # keep the live websocket open
    }
}
